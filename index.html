<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="description" content="写真の選んだ色だけを残して、他をモノクロにするAndroid向け写真編集アプリ">
<link rel="manifest" href="manifest.webmanifest">
<title>Color Accent</title>
<style>
:root{--bg:#0c0c0d;--panel:#151517;--line:#29292d;--text:#f7f7f8;--muted:#a7a7ad;--accent:#fff;--danger:#ff6363}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}button,input,select{font:inherit}button{border:0}.app{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:20;background:rgba(12,12,13,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}.head-actions{display:flex;gap:8px}button.ghost,button.primary,button.secondary{border-radius:12px;padding:10px 14px;cursor:pointer}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.primary{background:#fff;color:#111;font-weight:650}.secondary{background:#242427;color:#fff}.hidden{display:none!important}.home{padding:22px 16px 36px;display:grid;gap:16px}.hero{padding:8px 2px 10px}.hero h2{font-size:28px;margin:0 0 8px}.hero p{color:var(--muted);margin:0;line-height:1.6}.tiles{display:grid;gap:12px}.tile{background:linear-gradient(180deg,#18181b,#121214);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;min-height:98px}.tile strong{display:block;font-size:17px;margin-bottom:4px}.tile span{color:var(--muted);font-size:14px}.recent{display:flex;gap:10px;overflow:auto;padding-bottom:3px}.recent button{min-width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--line);padding:0}.editor{display:none;min-height:calc(100dvh - 61px)}.editor.active{display:flex;flex-direction:column}.canvas-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:42vh;padding:10px;background:#09090a}.canvas-wrap canvas{max-width:100%;max-height:58vh;touch-action:none;display:block;box-shadow:0 10px 40px rgba(0,0,0,.35)}.sample-dot{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px #000;pointer-events:none;transform:translate(-50%,-50%)}.toolbar{background:var(--panel);border-top:1px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:grid;gap:11px}.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row > button{flex:1}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.control{background:#101012;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.range-row{display:grid;grid-template-columns:78px 1fr 42px;gap:10px;align-items:center}.range-row input{width:100%}.range-row output{font-size:12px;color:var(--muted);text-align:right}.seg{display:flex;gap:6px;overflow:auto}.seg button{white-space:nowrap;background:#222225;color:#ddd;padding:9px 11px;border-radius:10px}.seg button.active{background:#fff;color:#111}.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;padding:10px 12px;border-radius:14px;background:#101012;border:1px solid var(--line)}.swatch{width:32px;height:32px;border-radius:10px;border:1px solid #fff2}.info small{color:var(--muted)}.bottom{display:flex;gap:8px}.bottom button{flex:1}.file-input{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;z-index:50}.sheet{width:100%;background:#17171a;border-top-left-radius:22px;border-top-right-radius:22px;padding:16px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 button{padding:13px;border-radius:12px;background:#26262a;color:#fff;border:1px solid var(--line)}.camera-video{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:#000;transform:scaleX(1)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#f3f3f3;color:#111;padding:10px 14px;border-radius:12px;z-index:100;display:none;font-size:14px}.footer-note{font-size:12px;color:#7c7c83;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header><h1>Color Accent</h1><div class="head-actions"><button class="ghost" id="homeBtn">Home</button><button class="primary" id="exportTop">書き出す</button></div></header>
<main>
<section class="home" id="home">
  <div class="hero"><h2>選んだ色を残す。</h2><p>写真をタップするだけで、その色をアクセントとして残し、それ以外をモノクロにします。</p></div>
  <div class="tiles">
    <button class="tile" id="pickPhoto"><strong>写真を選ぶ</strong><span>ギャラリーから写真を開いて編集</span></button>
    <button class="tile" id="takePhoto"><strong>カメラで撮る</strong><span>カメラで撮影してそのまま編集</span></button>
  </div>
  <div><div class="label" style="margin:4px 0 8px">最近使った色</div><div class="recent" id="recentColors"></div></div>
  <p class="footer-note">写真は端末内で処理します。外部サーバーへ送信する機能はありません。</p>
</section>
<section class="editor" id="editor">
  <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas><div class="sample-dot hidden" id="sampleDot"></div></div>
  <div class="toolbar">
    <div class="row"><button class="secondary" id="newPhoto">新しい写真</button><button class="secondary" id="undoBtn">元に戻す</button><button class="secondary" id="resetBtn">リセット</button></div>
    <div class="control">
      <div class="label">選択方法</div>
      <div class="seg" id="modeSeg"><button data-mode="global" class="active">写真全体</button><button data-mode="brush">ブラシ</button></div>
    </div>
    <div class="control" id="brushControl" style="display:none">
      <div class="label">ブラシ</div>
      <div class="range-row"><span>サイズ</span><input type="range" id="brushSize" min="8" max="180" value="54"><output id="brushSizeOut">54</output></div>
      <div class="row" style="margin-top:8px"><button class="secondary" id="brushPaint">塗る</button><button class="secondary" id="brushErase">消す</button></div>
    </div>
    <div class="control">
      <div class="label">色の範囲</div>
      <div class="range-row"><span>Range</span><input type="range" id="range" min="0" max="100" value="18"><output id="rangeOut">18</output></div>
      <div class="range-row"><span>Feather</span><input type="range" id="feather" min="0" max="100" value="20"><output id="featherOut">20</output></div>
    </div>
    <div class="control">
      <div class="label">モノクロ</div>
      <div class="range-row"><span>Tone</span><input type="range" id="tone" min="-80" max="80" value="0"><output id="toneOut">0</output></div>
      <div class="range-row"><span>Contrast</span><input type="range" id="contrast" min="-80" max="80" value="0"><output id="contrastOut">0</output></div>
    </div>
    <div class="control"><div class="label">書き出し</div><div class="seg" id="aspectSeg"><button data-aspect="free" class="active">原寸</button><button data-aspect="1">1:1</button><button data-aspect="4:5">4:5</button><button data-aspect="3:4">3:4</button><button data-aspect="9:16">9:16</button></div><div class="seg" id="frameSeg" style="margin-top:7px"><button data-frame="none" class="active">枠なし</button><button data-frame="white">白</button><button data-frame="black">黒</button></div></div>
    <div class="info"><div class="swatch" id="swatch"></div><div><div id="hex">#FFFFFF</div><small id="rgb">RGB 255, 255, 255</small></div></div>
    <div class="bottom"><button class="secondary" id="shareBtn">共有</button><button class="primary" id="exportBtn">保存</button></div>
  </div>
</section>
</main>
</div>
<input class="file-input" type="file" id="fileInput" accept="image/*">
<div class="modal hidden" id="cameraModal"><div class="sheet"><h3>カメラ</h3><video id="cameraVideo" class="camera-video" autoplay playsinline></video><div class="bottom" style="margin-top:12px"><button class="secondary" id="closeCamera">閉じる</button><button class="primary" id="shotCamera">撮影</button></div></div></div>
<div class="modal hidden" id="exportModal"><div class="sheet"><h3>書き出し</h3><div class="grid2"><button data-export="png">PNG</button><button data-export="jpeg">JPEG</button></div><div style="margin-top:10px"><button class="secondary" id="cancelExport" style="width:100%">キャンセル</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}), fileInput=$('#fileInput');
let img=null, original=null, result=null, targetHSV=null, mode='global', brushPaint=true, brushSize=54, recent=JSON.parse(localStorage.getItem('ca_recent')||'[]'), aspect='free', frame='none', history=[];
let mask=null, maskW=0, maskH=0;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hueDist(a,b){const d=Math.abs(a-b);return Math.min(d,360-d)}
function hex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}
function saveRecent(){localStorage.setItem('ca_recent',JSON.stringify(recent.slice(0,10)));renderRecent()}
function addRecent(c){recent=[c,...recent.filter(x=>x!==c)].slice(0,10);saveRecent()}
function renderRecent(){const box=$('#recentColors');box.innerHTML='';recent.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>{targetHSV=rgbToHsv(parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16));updateInfo();render()};box.appendChild(b)})}
function showHome(){ $('#editor').classList.remove('active'); $('#home').style.display='grid' }
function showEditor(){ $('#home').style.display='none'; $('#editor').classList.add('active') }
function fitSize(w,h,maxW=Math.min(innerWidth-20,1100),maxH=Math.floor(innerHeight*.58)){const s=Math.min(maxW/w,maxH/h,1);return[Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s))]}
function loadImage(source){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=source})}
async function openFile(file){const url=URL.createObjectURL(file);await openSrc(url);URL.revokeObjectURL(url)}
async function openSrc(src){img=await loadImage(src);const [w,h]=fitSize(img.width,img.height);canvas.width=w;canvas.height=h;original=new Uint8ClampedArray(w*h*4);const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(img,0,0,w,h);const d=tmp.getContext('2d').getImageData(0,0,w,h).data;original.set(d);result=new Uint8ClampedArray(d);maskW=w;maskH=h;mask=new Uint8Array(w*h);mask.fill(255);history=[];targetHSV=null;showEditor();render()}
function pickAt(x,y){if(!original)return;const p=(y*canvas.width+x)*4;const c=[original[p],original[p+1],original[p+2]];targetHSV=rgbToHsv(...c);addRecent(hex(...c));updateInfo();$('#sampleDot').style.left=x+($('#canvasWrap').clientWidth-canvas.clientWidth)/2+'px';$('#sampleDot').style.top=y+($('#canvasWrap').clientHeight-canvas.clientHeight)/2+'px';$('#sampleDot').classList.remove('hidden');render()}
function updateInfo(){if(!targetHSV)return;const c=hsvToRgb(...targetHSV);const h=hex(...c);$('#swatch').style.background=h;$('#hex').textContent=h;$('#rgb').textContent='RGB '+c.join(', ')}
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}
function photoMask(){const range=Number($('#range').value)*1.8;const feather=Math.max(1,Number($('#feather').value)*1.8);const out=new Uint8ClampedArray(maskW*maskH);if(!targetHSV){out.fill(0);return out}for(let y=0;y<maskH;y++)for(let x=0;x<maskW;x++){const p=(y*maskW+x)*4;const [h,s,v]=rgbToHsv(original[p],original[p+1],original[p+2]);let d=hueDist(h,targetHSV[0]);let w;if(d<=range)w=1;else if(d>=range+feather)w=0;else w=1-(d-range)/feather;w*=clamp(.65+s*.55,0,1);w*=clamp(.45+v*.7,0,1);out[y*maskW+x]=Math.round(w*255)}return out}
function render(){if(!original)return;const rangeMask=photoMask();const tone=Number($('#tone').value),contrast=Number($('#contrast').value);const factor=(259*(contrast+255))/(255*(259-contrast));const d=new Uint8ClampedArray(original.length);for(let y=0;y<maskH;y++)for(let x=0;x<maskW;x++){const p=(y*maskW+x),i=p*4;let m=rangeMask[p]/255;if(mode==='brush')m*=mask[p]/255;const lum=(0.2126*original[i]+0.7152*original[i+1]+0.0722*original[i+2]);let g=(lum-128)*factor+128+tone;g=clamp(g,0,255);d[i]=Math.round(original[i]*m+g*(1-m));d[i+1]=Math.round(original[i+1]*m+g*(1-m));d[i+2]=Math.round(original[i+2]*m+g*(1-m));d[i+3]=original[i+3]}result=d;const id=ctx.createImageData(maskW,maskH);id.data.set(d);ctx.putImageData(id,0,0)}
function pointFromEvent(e){const r=canvas.getBoundingClientRect();return{x:clamp(Math.floor((e.clientX-r.left)*canvas.width/r.width),0,canvas.width-1),y:clamp(Math.floor((e.clientY-r.top)*canvas.height/r.height),0,canvas.height-1)}}
let down=false;canvas.addEventListener('pointerdown',e=>{e.preventDefault();down=true;canvas.setPointerCapture(e.pointerId);const p=pointFromEvent(e);if(mode==='global')pickAt(p.x,p.y);else paintAt(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();const p=pointFromEvent(e);if(mode==='brush')paintAt(p.x,p.y)});['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>down=false));
function paintAt(x,y){const r=Math.max(2,brushSize*canvas.width/600);const rr=Math.ceil(r);for(let dy=-rr;dy<=rr;dy++)for(let dx=-rr;dx<=rr;dx++){if(dx*dx+dy*dy>r*r)continue;const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=maskW||yy>=maskH)continue;mask[yy*maskW+xx]=brushPaint?255:0}render()}
function pushHistory(){history.push({targetHSV:targetHSV?[...targetHSV]:null,mask:new Uint8Array(mask),range:$('#range').value,feather:$('#feather').value,tone:$('#tone').value,contrast:$('#contrast').value});if(history.length>12)history.shift()}
function restoreHistory(){const h=history.pop();if(!h)return;targetHSV=h.targetHSV;mask=h.mask;$('#range').value=h.range;$('#feather').value=h.feather;$('#tone').value=h.tone;$('#contrast').value=h.contrast;syncOutputs();updateInfo();render()}
canvas.addEventListener('pointerdown',()=>{if(mode==='brush'||mode==='global')pushHistory()},{capture:true});
$$('input[type=range]').forEach(x=>x.addEventListener('input',()=>{syncOutputs();render()}));
function syncOutputs(){$('#rangeOut').value=$('#range').value;$('#featherOut').value=$('#feather').value;$('#toneOut').value=$('#tone').value;$('#contrastOut').value=$('#contrast').value;$('#brushSizeOut').value=$('#brushSize').value}
$('#brushSize').addEventListener('input',()=>{brushSize=Number($('#brushSize').value);syncOutputs()});
$$('#modeSeg button').forEach(b=>b.onclick=()=>{$$('#modeSeg button').forEach(z=>z.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('#brushControl').style.display=mode==='brush'?'block':'none';render()});
$('#brushPaint').onclick=()=>{brushPaint=true;toast('塗るモード')};$('#brushErase').onclick=()=>{brushPaint=false;toast('消すモード')};
$$('#aspectSeg button').forEach(b=>b.onclick=()=>{$$('#aspectSeg button').forEach(z=>z.classList.remove('active'));b.classList.add('active');aspect=b.dataset.aspect});
$$('#frameSeg button').forEach(b=>b.onclick=()=>{$$('#frameSeg button').forEach(z=>z.classList.remove('active'));b.classList.add('active');frame=b.dataset.frame});
$('#pickPhoto').onclick=()=>fileInput.click();$('#newPhoto').onclick=()=>fileInput.click();fileInput.onchange=e=>{if(e.target.files[0])openFile(e.target.files[0])};
$('#homeBtn').onclick=showHome;$('#resetBtn').onclick=()=>{targetHSV=null;mask.fill(255);$('#range').value=18;$('#feather').value=20;$('#tone').value=0;$('#contrast').value=0;syncOutputs();$('#sampleDot').classList.add('hidden');render()};$('#undoBtn').onclick=restoreHistory;
async function camera(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('#cameraVideo').srcObject=s;$('#cameraModal').classList.remove('hidden')}catch(e){toast('カメラを開けませんでした')}}
$('#takePhoto').onclick=camera;$('#closeCamera').onclick=()=>{const v=$('#cameraVideo');if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());$('#cameraModal').classList.add('hidden')};
$('#shotCamera').onclick=async()=>{const v=$('#cameraVideo');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);$('#closeCamera').click();await openSrc(c.toDataURL('image/jpeg',.95))};
function buildExportCanvas(){const src=document.createElement('canvas');const sc=canvas;let w=sc.width,h=sc.height;if(aspect!=='free'){const [a,b]=aspect.split(':').map(Number);const want=a/b;const cur=w/h;if(cur>want)w=Math.round(h*want);else h=Math.round(w/want)}src.width=w;src.height=h;const sx=(canvas.width-w)/2,sy=(canvas.height-h)/2;const c=src.getContext('2d');if(frame==='white'||frame==='black'){c.fillStyle=frame==='white'?'#fff':'#000';c.fillRect(0,0,w,h);c.drawImage(canvas,sx,sy,w,h,0,0,w,h)}else c.drawImage(canvas,sx,sy,w,h,0,0,w,h);return src}
function dataURL(type){return buildExportCanvas().toDataURL(type==='jpeg'?'image/jpeg':'image/png',.95)}
async function doExport(type){const url=dataURL(type);const a=document.createElement('a');a.href=url;a.download='color-accent-'+Date.now()+'.'+(type==='jpeg'?'jpg':'png');a.click();toast('保存しました');$('#exportModal').classList.add('hidden')}
$('#exportBtn').onclick=()=>$('#exportModal').classList.remove('hidden');$('#exportTop').onclick=()=>{if(img)$('#exportModal').classList.remove('hidden');else toast('先に写真を選んでください')};$('#cancelExport').onclick=()=>$('#exportModal').classList.add('hidden');$$('[data-export]').forEach(b=>b.onclick=()=>doExport(b.dataset.export));
$('#shareBtn').onclick=async()=>{const blob=await (await fetch(dataURL('png'))).blob();const f=new File([blob],'color-accent.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({title:'Color Accent',files:[f]})}else{doExport('png')}};
renderRecent();syncOutputs();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
